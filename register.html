<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Регистрация — QuizApp</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container" style="max-width: 450px; padding-top: 40px;">
    <div class="card">
      <h1>Регистрация</h1>
      <div id="error" class="alert alert-error hidden"></div>
      <form id="registerForm">
        <div class="form-group">
          <label>Отображаемое имя</label>
          <input type="text" name="displayName" required>
        </div>
        <div class="form-group">
          <label>Логин</label>
          <input type="text" name="username" required>
        </div>
        <div class="form-group">
          <label>Пароль (мин. 6 символов)</label>
          <input type="password" name="password" required minlength="6">
        </div>
        <div class="form-group">
          <label>Роль</label>
          <select name="role" required>
            <option value="participant">Участник</option>
            <option value="organizer">Организатор</option>
          </select>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Зарегистрироваться</button>
      </form>
      <p style="margin-top: 20px; text-align: center;">
        Уже есть аккаунт? <a href="/login.html">Войти</a>
      </p>
    </div>
  </div>
  <script src="/js/auth.js"></script>
</body>
</html>
