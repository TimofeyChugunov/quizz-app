<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Управление квизом — QuizApp</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="game-screen">
    <!-- Лобби -->
    <div id="lobbyScreen">
      <h1 style="color: white; font-size: 48px;" id="quizTitle">Квиз</h1>
      <div class="room-code" id="roomCode">------</div>
      <p style="color: white; font-size: 20px;">Введите код на <strong>quizapp.local/join</strong></p>
      <div class="players-list" id="playersList"></div>
      <p style="color: white; margin: 15px 0;">Игроков: <span id="playersCount">0</span></p>
      <button class="btn btn-success" id="startBtn" style="padding: 18px 40px; font-size: 20px;" disabled>
        ▶ Начать квиз
      </button>
    </div>

    <!-- Вопрос -->
    <div id="questionScreen" class="hidden" style="width: 100%; max-width: 900px;">
      <div style="display: flex; justify-content: space-between; color: white; font-size: 18px;">
        <span>Вопрос <span id="qIndex">1</span>/<span id="qTotal">10</span></span>
        <span>⏱ <span id="timer">20</span> сек</span>
      </div>
      <div class="timer-bar"><div class="timer-bar-fill" id="timerBar"></div></div>
      <div class="card" style="margin-top: 20px;">
        <h2 id="questionText" style="font-size: 28px;"></h2>
        <img id="questionImage" class="question-image hidden">
      </div>
      <div style="color: white; margin-top: 20px;">
        Ответов получено: <span id="answersCount">0</span> / <span id="totalPlayers">0</span>
      </div>
    </div>

    <!-- Результаты вопроса -->
    <div id="revealScreen" class="hidden" style="width: 100%; max-width: 700px;">
      <div class="card">
        <h2>Результаты вопроса</h2>
        <div id="questionStats" style="font-size: 18px; margin: 15px 0;"></div>
        <h3>🏆 Лидерборд</h3>
        <div id="revealLeaderboard"></div>
        <button class="btn" id="nextBtn" style="margin-top: 20px; width: 100%;">
          Следующий вопрос →
        </button>
      </div>
    </div>

    <!-- Финал -->
    <div id="finalScreen" class="hidden">
      <h1 style="color: white; font-size: 48px;">🏆 Финальный лидерборд</h1>
      <div class="leaderboard" id="finalLeaderboard"></div>
      <a href="/dashboard.html" class="btn" style="margin-top: 20px;">В личный кабинет</a>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/host.js"></script>
</body>
</html>
