<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Вход в квиз — QuizApp</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container" style="max-width: 450px; padding-top: 80px;">
    <div class="card" style="text-align: center;">
      <h1>🎮 Присоединиться к квизу</h1>
      <div id="error" class="alert alert-error hidden"></div>
      <div class="form-group">
        <label>Код комнаты</label>
        <input type="text" id="roomCode" maxlength="6" placeholder="123456"
               style="font-size: 28px; text-align: center; letter-spacing: 8px;">
      </div>
      <div class="form-group">
        <label>Ваше имя</label>
        <input type="text" id="playerName" placeholder="Как вас зовут?">
      </div>
      <button class="btn" style="width: 100%;" onclick="joinByCode()">Играть!</button>
    </div>
  </div>
  <script>
    async function joinByCode() {
      const code = document.getElementById('roomCode').value.trim();
      const name = document.getElementById('playerName').value.trim() || 'Игрок';
      const errBox = document.getElementById('error');

      if (!/^\d{6}$/.test(code)) {
        errBox.textContent = 'Код должен содержать 6 цифр';
        errBox.classList.remove('hidden');
        return;
      }

      try {
        const res = await fetch(`/api/rooms/check/${code}`);
        if (!res.ok) throw new Error('Комната не найдена или已结束');
        const data = await res.json();
        // Сохраняем данные и переходим на экран игрока
        sessionStorage.setItem('joinData', JSON.stringify({
          roomCode: code,
          name,
          quizTitle: data.session.quiz_title
        }));
        window.location.href = '/player.html';
      } catch (e) {
        errBox.textContent = e.message;
        errBox.classList.remove('hidden');
      }
    }
    document.getElementById('roomCode').addEventListener('input', e => {
      e.target.value = e.target.value.replace(/\D/g, '');
    });
  </script>
</body>
</html>
